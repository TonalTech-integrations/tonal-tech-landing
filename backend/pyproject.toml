[project]
name = "tonal-tech-backend"
version = "0.1.0"
description = "FastAPI backend for Tonal Tech with Stripe payments and AWS S3 video delivery."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
  "fastapi>=0.111.1",
  "uvicorn[standard]>=0.23.0",
  "stripe==15.4.0",
  "boto3>=1.30.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.1.0",
  "email-validator>=1.5.0",
  "SQLAlchemy>=2.0.0",
  "psycopg2-binary>=2.9.0"
]

[project.scripts]
start = "uvicorn backend.main:app --reload"
