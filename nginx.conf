server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    absolute_redirect off;
    error_page 404 /tonal-tech-landing/404.html;

    location = / {
        return 301 /tonal-tech-landing/;
    }

    location = /tonal-tech-landing {
        return 301 /tonal-tech-landing/;
    }

    location /tonal-tech-landing/ {
        try_files $uri $uri/ =404;
    }
}
